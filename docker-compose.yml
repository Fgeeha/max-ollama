services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-ollama-bot
    env_file: .env
    volumes:
      - ./data:/app/data
    # Only needed for BOT_MODE=webhook, so MAX can reach the built-in
    # webhook server; harmless no-op in the default polling mode.
    ports:
      - "${WEBHOOK_PORT:-8081}:${WEBHOOK_PORT:-8081}"
    restart: unless-stopped
    networks:
      - ollama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

