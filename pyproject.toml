[project]
name = "max-ollama-bot"
version = "1.0.0"
description = "MAX messenger bot with Ollama integration for AI model interaction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "maxapi>=1.2.1",
    "sqlalchemy>=2.0.44",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "alembic>=1.17.1",
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "aiohttp>=3.13.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E203", "E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
